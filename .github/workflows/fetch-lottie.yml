name: fetch-lottie
on:
  workflow_dispatch:
  push:
    paths: ["lottie/list.txt"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download raw Lottie JSON (no conversion)
        run: |
          : > lottie/status.txt
          grep -v '^#' lottie/list.txt | while read -r name url rest; do
            [ -z "$name" ] && continue
            [ -f "lottie/$name" ] && { echo "HAVE $name" >> lottie/status.txt; continue; }
            code=$(curl -sSL -w '%{http_code}' "$url" -o "lottie/$name" || true)
            if [ "$code" = "200" ] && python3 -c "import json,sys;json.load(open(sys.argv[1]))" "lottie/$name"; then echo "OK $name" >> lottie/status.txt
            else rm -f "lottie/$name"; echo "FAIL $name http=$code" >> lottie/status.txt; fi
          done
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add lottie/ || true
          git diff --cached --quiet || git commit -m "Fetch Lottie animations" && git push
